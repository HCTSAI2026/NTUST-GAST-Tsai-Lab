name: Update Scopus publications

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * 1"

permissions:
  contents: write

jobs:
  update-scopus:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch Scopus publications
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
        run: python scripts/update_scopus.py

      - name: Commit updated publication data
        run: |
          if git diff --quiet -- data/scopus-publications.json; then
            echo "No Scopus changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scopus-publications.json
          git commit -m "Update Scopus publication data"
          git push
