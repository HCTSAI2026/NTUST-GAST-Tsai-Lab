name: Build PptxGenJS deck

on:
  workflow_dispatch:
  push:
    paths:
      - 'pptxgen/**'
      - '.github/workflows/build-pptx.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pptxgen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pptxgen/package.json

      - name: Install dependencies
        run: npm install

      - name: Build PowerPoint
        run: npm run build

      - name: Upload PowerPoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: NTUST-plenary-pptx
          path: pptxgen/NTUST_plenary.pptx
